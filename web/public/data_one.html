<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>数据分析</title> 
    <link href="css/antd.min.css" rel="stylesheet" type="text/css" />
    <link href="css/Menu.css" rel="stylesheet" type="text/css"/>
    <script src="js/vue.min.js"></script>
    <script src="js/antd.min.js"></script>
    <script src="js/xlsx.full.min.js"></script>
    <script charset="utf-8" src="js/echarts.min.js" type="text/javascript"></script>
    <style>
        #chart-container {
            margin: 24px;
            padding: 24px;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            min-height: 500px;
            min-width: 800px;
            position: relative;
        }

        .chart-title {
            font-size: 16px;
            color: rgba(0,0,0,0.85);
            margin-bottom: 20px;
            padding-left: 8px;
            border-left: 4px solid #1890ff;
        }

        #components-layout-demo-custom-trigger {
            min-height: 100vh;
        }

        #crumbs {
            margin: 16px 24px;
            padding: 8px 16px;
            background: #fff;
            border-radius: 4px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        .loading-message, .error-message {
            text-align: center;
            padding: 20px;
            color: #666;
            font-size: 16px;
        }
        
        .error-message {
            color: #ff4d4f;
        }

        .button-group {
            margin: 16px 24px 0;
            display: flex;
            gap: 10px;
        }

        .button-group button {
            padding: 8px 16px;
            background-color: #1890ff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .button-group button:hover {
            background-color: #40a9ff;
        }
    </style>
</head>
<body>
    <div id="app">
        <a-layout id="components-layout-demo-custom-trigger">
            <a-layout-sider v-model="collapsed" :trigger="null" collapsible style="background:linear-gradient(to right, #9796f0, #fbc7d4);">
                <div>
                    <a-menu :default-open-keys="['sub-1']" :default-selected-keys="['sub-1-1-2']" mode="inline" style="width: 200px">
                        <a-sub-menu key="sub-1" title="工作台">
                            <a-menu-item-group key="sub-1-1">
                                <a-menu-item key="sub-1-1-1"><a href="import.html">导入</a></a-menu-item>
                                <a-menu-item key="sub-1-1-2"><a href="data_one.html">单表数据分析</a></a-menu-item>
                                <a-menu-item key="sub-1-1-3"><a href="data_double.html"></a>多表数据分析</a></a-menu-item>
                            </a-menu-item-group>
                        </a-sub-menu>
                        <a-sub-menu key="sub2" title="活动">
                            <a-menu-item key="5">待建...</a-menu-item>
                            <a-menu-item key="6">待建...</a-menu-item>
                        </a-sub-menu>
                    </a-menu>
                </div>
            </a-layout-sider>

            <a-layout>
                <a-layout-header style="background: #fff; padding: 0"></a-layout-header>

                <a-breadcrumb id="crumbs">
                    <a-breadcrumb-item><a href="home.html">首页</a></a-breadcrumb-item>
                    <a-breadcrumb-item><a href="import.html">导入</a></a-breadcrumb-item>
                </a-breadcrumb>

                <a-layout-content>
                    <div class="button-group">
                        <button @click="renderChart('score')">📈 成绩分布</button>
                        <button @click="renderChart('status')">🎯 考试状态</button>
                        <button @click="renderChart('ranking')">🏆 学生排名</button>
                        <button @click="renderChart('question')">📝 题目得分率</button>
                    </div>
                    
                    <div id="chart-container">
                        <div class="chart-title">{{ chartTitle }}</div>
                        <div id="main-chart" style="width: 100%; height: 450px;"></div>
                    </div>
                </a-layout-content>
            </a-layout>
        </a-layout>
    </div>
    <script>
    var vm = new Vue({
        el: "#app",
        data() {
            return {
                collapsed: false,
                chartData: [],
                chartTitle: '请选择分析维度',
                questionColumns: [],
                totalScoreColumn: null,
                isDataLoaded: false
            };
        },
        mounted() {
            this.loadData();
        },
        methods: {
            loadData() {
                try {
                    const savedData = localStorage.getItem('examData');
                    const savedColumns = localStorage.getItem('examColumns');
                    
                    if (!savedData || !savedColumns) {
                        console.error('数据未找到，请先导入Excel文件');
                        return;
                    }

                    this.chartData = JSON.parse(savedData);
                    const columns = JSON.parse(savedColumns);
                    
                    this.questionColumns = this.detectQuestionColumns(columns);
                    this.totalScoreColumn = this.detectTotalScoreColumn(columns);
                    
                    if (!this.totalScoreColumn) {
                        console.error('未找到总成绩列，请检查Excel表头');
                    }

                    console.log('题目列检测结果:', this.questionColumns);
                    console.log('总成绩列:', this.totalScoreColumn);
                    console.log('加载的数据:', this.chartData);
                    this.isDataLoaded = true;
                } catch (e) {
                    console.error('数据解析失败:', e);
                }
            },

            detectTotalScoreColumn(columns) {
                const totalScoreCol = columns.find(col => 
                    col.title && col.title.includes('总分')
                );
                return totalScoreCol ? totalScoreCol.dataIndex : null;
            },
            
            detectQuestionColumns(columns) {
                return columns
                    .filter(col => col.title && (
                        col.title.match(/^（\d+）$/) ||
                        col.title.match(/^\d+$/)
                    ))
                    .map(col => col.dataIndex);
            },

            calculateScoreDistribution(scores) {
                return [
                    scores.filter(s => s < 60).length,
                    scores.filter(s => s >= 60 && s < 70).length,
                    scores.filter(s => s >= 70 && s < 80).length,
                    scores.filter(s => s >= 80 && s < 90).length,
                    scores.filter(s => s >= 90).length
                ];
            },

            renderChart(type) {
                if (!this.isDataLoaded) {
                    console.error('数据未加载完成，请稍后再试');
                    return;
                }

                // 根据不同的 type 设置 chartTitle
                switch(type) {
                    case 'score':
                        this.chartTitle = '成绩分布';
                        break;
                    case 'status':
                        this.chartTitle = '考试状态';
                        break;
                    case 'ranking':
                        this.chartTitle = '学生排名';
                        break;
                    case 'question':
                        this.chartTitle = '题目得分率';
                        break;
                    default:
                        this.chartTitle = '请选择分析维度';
                }

                this.$nextTick(() => {
                    try {
                        const chartDom = document.getElementById('main-chart');
                        if (!chartDom) {
                            console.error('图表容器未找到');
                            return;
                        }
                        
                        const myChart = echarts.init(chartDom);
                        myChart.clear();

                        chartDom.style.width = '100%';
                        chartDom.style.height = '450px';
                        myChart.resize();

                        switch(type) {
                            case 'score':
                                this.renderScoreChart(myChart);
                                break;
                            case 'status':
                                this.renderStatusChart(myChart);
                                break;
                            case 'ranking':
                                this.renderRankingChart(myChart, chartDom);
                                break;
                            case 'question':
                                this.renderQuestionChart(myChart, chartDom);
                                break;
                        }
                    } catch (e) {
                        console.error('图表渲染失败:', e);
                        chartDom.innerHTML = '<div class="error-message">图表生成失败，请检查数据格式</div>';
                    }
                });
            },

            renderScoreChart(chart) {
                const scores = this.chartData.map(item => parseFloat(item['8']) || 0);
                const option = {
                    title: { show: false },
                    tooltip: { trigger: 'axis' },
                    xAxis: {
                        type: 'category',
                        data: ['0-59', '60-69', '70-79', '80-89', '90-100'],
                        axisLabel: { color: '#666' }
                    },
                    yAxis: { 
                        type: 'value',
                        axisLabel: { color: '#666' }
                    },
                    series: [{
                        type: 'bar',
                        data: this.calculateScoreDistribution(scores),
                        itemStyle: {
                            color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
                                { offset: 0, color: '#83bff6' },
                                { offset: 1, color: '#188df0' }
                            ])
                        }
                    }],
                    grid: { containLabel: true, left: '3%', right: '3%' }
                };
                chart.setOption(option);
            },

            renderStatusChart(chart) {
                const statusCounts = {
                    completed: this.chartData.filter(item => item['9'] !== '未参加考试').length,
                    uncompleted: this.chartData.filter(item => item['9'] === '未参加考试').length
                };
                
                const option = {
                    title: { show: false },
                    tooltip: { 
                        trigger: 'item',
                        formatter: '{b}: {c} ({d}%)'
                    },
                    series: [{
                        type: 'pie',
                        radius: ['40%', '65%'],
                        center: ['50%', '55%'],
                        data: [
                            { value: statusCounts.completed, name: '已参加', itemStyle: { color: '#36cbcb' } },
                            { value: statusCounts.uncompleted, name: '未参加', itemStyle: { color: '#fad337' } }
                        ],
                        label: {
                            color: '#666',
                            fontSize: 14
                        },
                        emphasis: {
                            itemStyle: {
                                shadowBlur: 10,
                                shadowOffsetX: 0,
                                shadowColor: 'rgba(0, 0, 0, 0.5)'
                            }
                        }
                    }]
                };
                chart.setOption(option);
            },

            renderRankingChart(chart, chartDom) {
                if (!this.totalScoreColumn) {
                    chartDom.innerHTML = '<div class="error-message">未找到总成绩列，无法生成排名</div>';
                    return;
                }

                const validData = this.chartData
                    .filter(item => !isNaN(parseFloat(item[this.totalScoreColumn])))
                    .sort((a, b) => 
                        parseFloat(b[this.totalScoreColumn]) - parseFloat(a[this.totalScoreColumn])
                    )
                    .slice(0, 10);

                if (validData.length === 0) {
                    chartDom.innerHTML = '<div class="error-message">无有效成绩数据</div>';
                    return;
                }

                const option = {
                    title: { show: false },
                    tooltip: { trigger: 'axis' },
                    xAxis: {
                        type: 'category',
                        data: validData.map(item => item['2']),
                        axisLabel: { 
                            color: '#666',
                            rotate: 45 
                        }
                    },
                    yAxis: { 
                        type: 'value',
                        axisLabel: { color: '#666' }
                    },
                    series: [{
                        type: 'bar',
                        data: validData.map(item => parseFloat(item[this.totalScoreColumn])),
                        itemStyle: {
                            color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
                                { offset: 0, color: '#975fe4' },
                                { offset: 1, color: '#722ed1' }
                            ])
                        }
                    }],
                    grid: { 
                        containLabel: true,
                        left: '3%',
                        right: '3%',
                        bottom: '15%'
                    }
                };
                chart.setOption(option);
            },

            renderQuestionChart(chart, chartDom) {
                // 强制设置容器尺寸
                chartDom.style.width = '100%';
                chartDom.style.height = '450px';
                chart.resize(); // 立即调整一次尺寸

                if (this.questionColumns.length === 0) {
                    chartDom.innerHTML = '<div class="error-message">未检测到题目列</div>';
                    return;
                }

                const questionData = this.getQuestionData();
                console.log('题目数据:', questionData);

                if (!questionData || questionData.values.every(v => v === 0 || isNaN(v))) {
                    chartDom.innerHTML = '<div class="error-message">无有效题目得分数据</div>';
                    return;
                }

                const option = {
                    title: { 
                        
                        left: 'center',
                        textStyle: {
                            fontSize: 18,
                            fontWeight: 'bold'
                        }
                    },
                    tooltip: { 
                        trigger: 'axis',
                        formatter: '第{b}题: {c}%'
                    },
                    xAxis: {
                        type: 'category',
                        data: questionData.labels,
                        axisLabel: { 
                            color: '#666',
                            rotate: 45 
                        }
                    },
                    yAxis: { 
                        type: 'value',
                        axisLabel: { color: '#666' },
                        max: 100
                    },
                    series: [{
                        type: 'bar',
                        data: questionData.values,
                        itemStyle: {
                            color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
                                { offset: 0, color: '#83bff6' },
                                { offset: 1, color: '#188df0' }
                            ])
                        }
                    }],
                    grid: { 
                        containLabel: true,
                        left: '3%',
                        right: '3%',
                        bottom: '15%'
                    }
                };
                
                chart.clear();
                chart.setOption(option);

                // 添加延迟确保尺寸正确
                setTimeout(() => {
                    chart.resize();
                }, 2000);
            },

            getQuestionData() {
                const labels = [];
                const values = [];

                this.questionColumns.forEach((col, index) => {
                    const scoreProbability = this.calculateQuestionScoreProbability(col);
                    labels.push(`第${index + 1}题`);
                    values.push(Number(scoreProbability));
                });

                console.log('题目列数据:', { labels, values });
                return { labels, values };
            },

            calculateQuestionScoreProbability(key) {
                const totalStudents = this.chartData.length;
                if (totalStudents === 0) return 0;

                const scoredStudents = this.chartData.filter(item => {
                    const score = parseFloat(item[key]);
                    return !isNaN(score) && score > 0;
                });

                const probability = (scoredStudents.length / totalStudents) * 100;
                return probability.toFixed(2);
            }
        }
    });
    </script>
</body>
</html>
