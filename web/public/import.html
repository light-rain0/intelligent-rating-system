<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>导入</title>
    <link href="css/antd.min.css" rel="stylesheet" type="text/css" />
    <script src="js/vue.min.js"></script>
    <script src="js/antd.min.js"></script>
    <script src="js/xlsx.full.min.js"></script>
    <style>
        .ant-table-thead > tr:first-child > th {
            position: sticky;
            top: 0;
            z-index: 1;
            background: #fafafa !important;
        }
        
        .ant-table-thead > tr:nth-child(2) > th {
            position: sticky;
            top: 49px;
            z-index: 1;
            background: #fafafa !important;
        }

        #components-layout-demo-custom-trigger {
            min-height: 100vh;
        }

        #table-container {
            margin: 24px 16px;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            overflow: hidden;
        }

        .toolbar {
            padding: 24px 24px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
        }

        .filter-group {
            display: flex;
            gap: 16px;
            align-items: center;
        }

        #crumbs {
            margin: 16px 24px;
            padding: 8px 16px;
            background: #fff;
            border-radius: 4px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        .sheet-name {
            margin: 0 24px 16px;
            padding: 8px 16px;
            background: #fff;
            border-radius: 4px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            font-size: 14px;
            color: rgba(0, 0, 0, 0.85);
            display: flex;
            align-items: center;
        }

        .ant-upload-list {
            display: none;
        }

        .file-list {
            padding: 0 24px 24px;
        }
        .file-item {
            padding: 8px;
            margin: 4px 0;
            background: #f5f5f5;
            border-radius: 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background 0.3s;
        }
        .file-item:hover {
            background: #e8e8e8;
        }
        .delete-icon {
            color: #ff4d4f;
            cursor: pointer;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .file-item:hover .delete-icon {
            opacity: 1;
        }
    </style>
</head>
<body>
    <div id="app">
        <a-layout id="components-layout-demo-custom-trigger">
            <a-layout-sider v-model="collapsed" :trigger="null" collapsible 
                style="background:linear-gradient(to right, #9796f0, #fbc7d4);">
                <a-menu :default-open-keys="['sub-1']"
                    :default-selected-keys="['sub-1-1-1']" 
                    mode="inline"
                    style="width: 200px">
                    <a-sub-menu key="sub-1" title="工作台">
                        <a-menu-item-group key="sub-1-1">
                            <a-menu-item key="sub-1-1-1"><a href="import.html">导入</a></a-menu-item>
                            <a-menu-item key="sub-1-1-2"><a href="data_one.html">单表数据分析</a></a-menu-item>
                            <a-menu-item key="sub-1-1-3"><a href="data_double.html"></a>多表数据分析</a></a-menu-item>
                        </a-menu-item-group>
                    </a-sub-menu>
                    <a-sub-menu key="sub2" title="日志">
                        <a-menu-item key="5">待建...</a-menu-item>
                        <a-menu-item key="6">待建...</a-menu-item>
                    </a-sub-menu>
                </a-menu>
            </a-layout-sider>

            <a-layout>
                <a-layout-header style="background: #fff; padding: 0"></a-layout-header>

                <a-breadcrumb id="crumbs">
                    <a-breadcrumb-item><a href="home.html">首页</a></a-breadcrumb-item>
                    <a-breadcrumb-item><a href="import.html">导入</a></a-breadcrumb-item>
                </a-breadcrumb>

                <div v-if="sheetName" class="sheet-name">
                    <span>当前表格：{{ sheetName }}</span>
                    <a-button style="margin-left: 8px;" type="link" @click="clearData('single')">清除</a-button>
                </div>

                <a-layout-content>
                    <div id="table-container">
                        <div class="toolbar">
                            <div class="filter-group">
                                <!-- 单文件上传 -->
                                <a-upload :before-upload="handleSingleUpload"
                                    :multiple="false"
                                    :show-upload-list="false"
                                    name="file">
                                    <a-button type="primary">
                                        上传Excel文件
                                        <a-icon type="upload" />
                                    </a-button>
                                </a-upload>

                                <!-- 多文件/文件夹上传 -->
                                <a-upload :before-upload="handleMultiUpload"
                                    :custom-request="dummyRequest"
                                    :multiple="true"
                                    :show-upload-list="false"
                                    directory
                                    name="files">
                                    <a-button type="default">
                                        上传多个/文件夹
                                        <a-icon type="folder-open" />
                                    </a-button>
                                </a-upload>
                               

                                <!-- 筛选组件 -->
                                <a-select v-model="sortOrder" placeholder="排序方式" style="width: 120px">
                                    <a-select-option value="">默认排序</a-select-option>
                                    <a-select-option value="asc">成绩升序</a-select-option>
                                    <a-select-option value="desc">成绩降序</a-select-option>
                                </a-select>

                                <a-select v-model="examStatus" placeholder="考试状态" style="width: 120px">
                                    <a-select-option value="">全部状态</a-select-option>
                                    <a-select-option value="completed">已参加</a-select-option>
                                    <a-select-option value="uncompleted">未参加</a-select-option>
                                </a-select>

                                <a-select v-model="passStatus" placeholder="成绩状态" style="width: 120px">
                                    <a-select-option value="">全部成绩</a-select-option>
                                    <a-select-option value="pass">合格</a-select-option>
                                    <a-select-option value="fail">不合格</a-select-option>
                                </a-select>

                                <a-input-number 
                                    v-model="passingScore" 
                                    :max="100"
                                    :min="0" 
                                    placeholder="及格线"
                                    style="width: 100px" />
                            </div>

                            <a-input-search 
                                v-model="searchText" 
                                allow-clear
                                placeholder="输入关键词搜索"
                                style="width: 300px"
                                @search="handleSearch" />
                        </div>

                        <!-- 文件列表 -->
                        <div v-if="uploadedFiles.length > 0 && !showTable" class="file-list">
                            <h4>已上传文件（共{{ uploadedFiles.length }}个）:</h4>
                            <div v-for="(file, index) in uploadedFiles" 
                                :key="file.name" 
                                class="file-item"
                                @mouseleave="hoverIndex = -1"
                                @mouseover="hoverIndex = index">
                                <span>{{ file.name }} ({{ (file.size/1024).toFixed(2) }}KB)</span>
                                <a-icon 
                                    class="delete-icon"
                                    type="close-circle"
                                    @click="removeFile(index)" />
                            </div>
                        </div>

                        <!-- 数据表格 -->
                        <div v-if="showTable" style="padding: 0 24px 24px;">
                            <a-table 
                                :columns="columns" 
                                :data-source="filteredData" 
                                :pagination="false"
                                :rowClassName="(record, index) => (index % 2 === 1 ? 'table-row-light' : 'table-row-dark')"
                                :scroll="{ x: 'max-content', y: 'calc(100vh - 280px)' }"
                                bordered />
                        </div>
                    </div>
                </a-layout-content>
            </a-layout>
        </a-layout>
    </div>
    <script>
    var vm = new Vue({
        el: "#app",
        data() {
            return {
                collapsed: false,
                current: ['mail'],
                openKeys: ['sub1'],
                tableData: [],
                originalData: [],
                columns: [],
                sheetName: '',
                uploadedFiles: [],
                showTable: true,
                searchText: '',
                sortOrder: '',
                examStatus: '',
                passStatus: '',
                passingScore: 70,
                hoverIndex: -1
            };
        },
        computed: {
            filteredData() {
                let data = this.tableData;
                if (this.searchText) {
                    const search = this.searchText.toLowerCase();
                    data = data.filter(row =>
                        Object.values(row).some(value =>
                            String(value).toLowerCase().includes(search))
                    );
                }
                if (this.examStatus === 'completed') {
                    data = data.filter(row => row['9'] !== '未参加考试');
                } else if (this.examStatus === 'uncompleted') {
                    data = data.filter(row => row['9'] === '未参加考试');
                }
                if (this.passStatus === 'pass') {
                    data = data.filter(row => {
                        const score = parseFloat(row['8']);
                        return !isNaN(score) && score >= this.passingScore;
                    });
                } else if (this.passStatus === 'fail') {
                    data = data.filter(row => {
                        const score = parseFloat(row['8']);
                        return !isNaN(score) && score < this.passingScore;
                    });
                }
                if (this.sortOrder) {
                    data = [...data].sort((a, b) => {
                        const scoreA = parseFloat(a['8']) || 0;
                        const scoreB = parseFloat(b['8']) || 0;
                        return this.sortOrder === 'asc' ? scoreA - scoreB : scoreB - scoreA;
                    });
                }
                return data;
            }
        },
        mounted() {
            // 加载本地存储数据
            const savedData = localStorage.getItem('examData');
            const savedColumns = localStorage.getItem('examColumns');
            const savedSheet = localStorage.getItem('sheetName');
            const savedFiles = localStorage.getItem('uploadedFiles');
            
            if (savedData && savedColumns) {
                try {
                    this.tableData = JSON.parse(savedData);
                    this.originalData = JSON.parse(savedData);
                    this.columns = JSON.parse(savedColumns);
                    this.sheetName = savedSheet || '';
                } catch (e) {
                    console.error('表格数据加载失败:', e);
                    this.clearStorage('single');
                }
            }

            if (savedFiles) {
                try {
                    this.uploadedFiles = JSON.parse(savedFiles).map(file => 
                        new File([], file.name, { type: file.type })
                    );
                    // 如果 uploadedFiles 为空，则显示表格
                    this.showTable = this.uploadedFiles.length === 0;
                } catch (e) {
                    console.error('文件列表加载失败:', e);
                    this.clearStorage('multi');
                }
            }
        },
        methods: {
            handleSingleUpload(file) {
                this.showTable = true;
                this.uploadedFiles = [];
                this.processExcelFile(file);
                return false;
            },

            handleMultiUpload(file) {
                this.showTable = false;
                this.uploadedFiles = [...this.uploadedFiles, file];
                this.saveFilesToStorage();
                return false;
            },

            dummyRequest({ file, onSuccess }) {
                setTimeout(() => {
                    onSuccess("ok");
                }, 0);
            },

            processExcelFile(file) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const workbook = XLSX.read(e.target.result, { type: 'binary' });
                    const worksheet = workbook.Sheets[workbook.SheetNames[0]];
                    const jsonData = XLSX.utils.sheet_to_json(worksheet, { header: 1 });

                    this.sheetName = workbook.SheetNames[0];
                    
                    const frontColumns = jsonData[1].slice(0, 25).map((col, index) => ({
                        title: col,
                        dataIndex: index.toString(),
                        key: index.toString(),
                        width: 200,
                        ellipsis: true,
                        align: 'center'
                    }));

                    const middleColumns = jsonData[2].slice(25, 77).map((col, index) => ({
                        title: col,
                        dataIndex: (25 + index).toString(),
                        key: (25 + index).toString(),
                        width: 200,
                        ellipsis: true,
                        align: 'center'
                    }));

                    const endColumns = jsonData[1].slice(77, 80).map((col, index) => ({
                        title: col || `列${77 + index}`,
                        dataIndex: (77 + index).toString(),
                        key: (77 + index).toString(),
                        width: 200,
                        ellipsis: true,
                        align: 'center'
                    }));

                    this.columns = [...frontColumns, ...middleColumns, ...endColumns];

                    const newData = jsonData.slice(3).map((row, rowIndex) => {
                        const rowData = {};
                        for (let cellIndex = 0; cellIndex < 81; cellIndex++) {
                            rowData[cellIndex.toString()] = row[cellIndex] || '';
                        }
                        rowData.key = rowIndex.toString();
                        return rowData;
                    });

                    this.originalData = newData;
                    this.tableData = newData;

                    localStorage.setItem('examData', JSON.stringify(newData));
                    localStorage.setItem('examColumns', JSON.stringify(this.columns));
                    localStorage.setItem('sheetName', this.sheetName);
                };
                reader.readAsBinaryString(file);
            },

            handleSearch(value) {
                this.searchText = value;
            },

            clearData(type) {
                if (type === 'single') {
                    this.tableData = [];
                    this.originalData = [];
                    this.columns = [];
                    this.sheetName = '';
                    this.clearStorage('single');
                } else {
                    this.uploadedFiles = [];
                    this.clearStorage('multi');
                    this.showTable = true;
                }
            },

            removeFile(index) {
                this.uploadedFiles = this.uploadedFiles.filter((_, i) => i !== index);
                this.saveFilesToStorage();
                // 新增：当删除最后一个文件时恢复表格显示
                if (this.uploadedFiles.length === 0) {
                    this.showTable = true;
                }
            },

            saveFilesToStorage() {
                const filesData = this.uploadedFiles.map(file => ({
                    name: file.name,
                    size: file.size,
                    type: file.type
                }));
                localStorage.setItem('uploadedFiles', JSON.stringify(filesData));
            },

            clearStorage(type) {
                if (type === 'single') {
                    localStorage.removeItem('examData');
                    localStorage.removeItem('examColumns');
                    localStorage.removeItem('sheetName');
                } else {
                    localStorage.removeItem('uploadedFiles');
                }
            }
        }
    });
    </script>
</body>
</html>
